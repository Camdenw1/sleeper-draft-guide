name: Refresh draft board data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install data dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild and validate generated data
        run: python refresh/build.py
      - name: Commit a changed board
        run: |
          if git diff --quiet -- board-data.js rankings.csv; then
            echo "No ranking changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add board-data.js rankings.csv
          git commit -m "Refresh draft board data"
          git push
